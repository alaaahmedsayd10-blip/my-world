<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>تسجيل الدخول — Yalla City</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#312e81,transparent 55%),#0b1020;color:#f8fafc;font-family:system-ui,Tahoma,Arial,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid #ffffff20;border-radius:24px;background:#151d32;box-shadow:0 24px 70px #0006}.brand{font-size:1.5rem;font-weight:900;margin-bottom:6px}.muted{color:#a9b4ca;line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 16px}.tab,button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:750;cursor:pointer}.tab{background:#ffffff0b;color:#dbeafe}.tab.active,button{background:linear-gradient(100deg,#7c3aed,#5b21b6);color:white}label{display:block;margin:14px 0 7px;color:#dbeafe;font-size:.92rem}input{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff24;background:#0b1020;color:white;font:inherit}button{width:100%;margin-top:18px}button:disabled{opacity:.6;cursor:wait}.message{margin-top:14px;font-size:.9rem;line-height:1.6;color:#a5f3fc;min-height:1.5em}.message.error{color:#fda4af}.small{font-size:.8rem;margin-top:18px;color:#8793aa}
</style>
</head>
<body><main class="card">
<div class="brand">🌐 Yalla City</div><div class="muted">سجّل دخولك أو أنشئ حساب جديد علشان تحفظ رصيدك وتقدمك في العالم.</div>
<div class="tabs"><button class="tab active" id="loginTab" type="button">تسجيل الدخول</button><button class="tab" id="registerTab" type="button">حساب جديد</button></div>
<form id="authForm">
<label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
<label for="password">كلمة المرور</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="6 أحرف على الأقل">
<button id="submit" type="submit">دخول</button>
</form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="small">لا تشارك كلمة مرورك مع أي شخص. استخدم بريدك الحقيقي لاستعادة الحساب عند تفعيل الاسترداد.</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain:"game-af286.firebaseapp.com",projectId:"game-af286",storageBucket:"game-af286.firebasestorage.app",messagingSenderId:"567693078252",appId:"1:567693078252:web:3b5d6475a583f1f7347fc9",measurementId:"G-JKFYDGCFML"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const form=document.querySelector("#authForm"),email=document.querySelector("#email"),password=document.querySelector("#password"),submit=document.querySelector("#submit"),message=document.querySelector("#message"),loginTab=document.querySelector("#loginTab"),registerTab=document.querySelector("#registerTab");
let mode="login",busy=false;
function say(text,error=false){message.textContent=text;message.classList.toggle("error",error)}
function setMode(next){mode=next;loginTab.classList.toggle("active",mode==="login");registerTab.classList.toggle("active",mode==="register");submit.textContent=mode==="login"?"دخول":"إنشاء الحساب";password.autocomplete=mode==="login"?"current-password":"new-password";say("")}
loginTab.addEventListener("click",()=>setMode("login"));registerTab.addEventListener("click",()=>setMode("register"));
onAuthStateChanged(auth,user=>{if(user&&!busy){say("أنت مسجل الدخول بالفعل.");}});
form.addEventListener("submit",async e=>{e.preventDefault();if(busy)return;busy=true;submit.disabled=true;say("جاري الاتصال...");
try{
 const mail=email.value.trim().toLowerCase();let credential;
 if(mode==="register"){credential=await createUserWithEmailAndPassword(auth,mail,password.value);}
 else{credential=await signInWithEmailAndPassword(auth,mail,password.value);}
 const user=credential.user,ref=doc(db,"users",user.uid),existing=await getDoc(ref);
 if(!existing.exists()){await setDoc(ref,{phone:mail,gold:5,animals:[],createdAt:serverTimestamp()});}
 say(mode==="register"?"تم إنشاء حسابك بنجاح! ارجع للعبة.":"تم تسجيل الدخول بنجاح! ارجع للعبة.");
 if(window.parent!==window){setTimeout(()=>{try{window.parent.postMessage({type:"yalla-city-auth-success"},"*")}catch{}},700);}
}catch(err){const code=err?.code;const messages={"auth/email-already-in-use":"البريد ده مسجل قبل كده. جرّب تسجيل الدخول.","auth/invalid-email":"اكتب بريد إلكتروني صحيح.","auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة.","auth/weak-password":"كلمة المرور لازم تكون 6 أحرف على الأقل.","auth/operation-not-allowed":"تسجيل البريد وكلمة المرور مش مفعّل في Firebase Authentication.","auth/network-request-failed":"مشكلة اتصال بالإنترنت. جرّب تاني.","permission-denied":"قواعد Firestore رفضت إنشاء ملف الحساب. راجع إعدادات Firebase."};say(messages[code]||("تعذر إتمام العملية ("+(code||"unknown")+"). راجع إعدادات Firebase."),true);
}finally{busy=false;submit.disabled=false;}});
</script></body></html>
