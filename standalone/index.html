<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b35"><title>Yalla City</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div id="auth" class="auth"><section class="auth-card"><div class="logo">🌆</div><h1>Yalla City</h1><p>مدينتك، أصحابك، وعالمك</p><label>البريد الإلكتروني<input id="email" type="email" placeholder="name@example.com"></label><label>كلمة المرور<input id="password" type="password" placeholder="6 أحرف على الأقل"></label><div class="actions"><button id="signup">إنشاء حساب</button><button id="signin" class="secondary">دخول</button></div><p id="auth-message">نسخة أولية مستقلة. يلزم توصيل Firebase لتفعيل الحسابات والشات أونلاين.</p></section></div>
<header><b>🌆 Yalla City</b><span id="status">وضع تجريبي</span><button id="logout" hidden class="secondary">خروج</button></header>
<main><section class="world"><canvas id="world"></canvas><div class="tip">تحرك بالأسهم أو WASD، أو استخدم الأزرار على الهاتف</div><div class="controls"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div></section><aside><section class="panel"><h2>👥 اللاعبون</h2><div id="players">بانتظار الاتصال</div></section><section class="panel"><h2>💬 شات المدينة</h2><div id="messages" class="messages"></div><form id="chat-form"><input id="chat-input" maxlength="300" placeholder="اكتب رسالة..."><button>إرسال</button></form></section></aside></main><script type="module" src="./app.js"></script></body></html>
