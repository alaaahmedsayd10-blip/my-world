name: Deploy Yalla City to GitHub Pages

on:
  push:
    branches:
      - yalla-city-standalone
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-yalla-city.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone game
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
