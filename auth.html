<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:sans-serif} .card{background:#1e1e1e;padding:22px;border-radius:18px;width:300px;border:1px solid #333;text-align:center} input{width:92%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#fff} button{width:100%;padding:12px;border-radius:10px;border:none;margin-top:8px;font-weight:bold;cursor:pointer} .main{background:#fff;color:#000} .sec{background:#333;color:#fff} #msg{font-size:12px;margin-top:10px;color:#aaa}</style>
</head><body><div class="card">
<h3>🔐 دخول / حساب جديد</h3>
<input id="email" placeholder="الإيميل">
<input id="pass" type="password" placeholder="كلمة السر (6 حروف على الأقل)">
<button class="main" onclick="doLogin()">دخول</button>
<button class="sec" onclick="doReg()">إنشاء حساب</button>
<p id="msg"></p>
</div>
<script>
const cfg={apiKey:"AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain:"game-af286.firebaseapp.com",projectId:"game-af286",storageBucket:"game-af286.firebasestorage.app",messagingSenderId:"567693078252",appId:"1:567693078252:web:3b5d6475a583f1f7347fc9"};
firebase.initializeApp(cfg);
const auth=firebase.auth(), db=firebase.firestore();
const charName=new URLSearchParams(location.search).get('name')||'لاعب';
WA.onInit().then(()=>{}).catch(()=>{});

function closeModal(){
  const em = auth.currentUser ? auth.currentUser.email : document.getElementById('email').value;
  try{ WA.player.state.saveVariable('email', em); }catch(e){}
  try{ localStorage.setItem('wa_email', em); }catch(e){}
  try{ parent.localStorage.setItem('wa_email', em); }catch(e){}
  localStorage.setItem('wa_logged','1');
  document.getElementById('msg').innerText='✅ تم بنجاح...';
  try{ WA.ui.modal.closeModal(); }catch(e){}
  try{ parent.WA.ui.modal.closeModal(); }catch(e){}
  try{ window.parent.WA.ui.modal.closeModal(); }catch(e){}
  setTimeout(()=>{ try{parent.WA.ui.modal.closeModal()}catch{} }, 700);
}

function saveUser(u){
  db.collection('players').doc(u.uid).set({email:u.email,charName:charName,created:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(closeModal).catch(e=>{document.getElementById('msg').innerText=e.message});
}

function doReg(){
  const e=document.getElementById('email').value.trim(), p=document.getElementById('pass').value;
  if(!e||p.length<6){document.getElementById('msg').innerText='اكتب إيميل صحيح وباسورد 6 حروف';return;}
  document.getElementById('msg').innerText='...بيسجل';
  auth.createUserWithEmailAndPassword(e,p).then(r=>saveUser(r.user)).catch(err=>document.getElementById('msg').innerText=err.message);
}
function doLogin(){
  const e=document.getElementById('email').value.trim(), p=document.getElementById('pass').value;
  document.getElementById('msg').innerText='...بيدخل';
  auth.signInWithEmailAndPassword(e,p).then(r=>saveUser(r.user)).catch(err=>document.getElementById('msg').innerText='الإيميل أو الباس غلط');
}
</script></body></html>
