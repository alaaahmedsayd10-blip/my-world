<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body{background:#0f0f0f;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.card{background:#1e1e1e;padding:25px;border-radius:16px;width:310px;text-align:center;box-shadow:0 0 20px #000}
input{width:92%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:white;outline:none}
button{padding:12px;width:100%;border:none;border-radius:10px;margin-top:8px;cursor:pointer;font-weight:bold;font-size:15px}
.login{background:#00c851;color:white}
.reg{background:#333;color:white}
#msg{margin-top:12px;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h2>🎮 دخول اللعبة</h2>
<input id="email" type="email" placeholder="الإيميل">
<input id="pass" type="password" placeholder="الباسورد">
<button class="login" onclick="login()">دخول</button>
<button class="reg" onclick="register()">تسجيل حساب جديد</button>
<p id="msg"></p>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",
  authDomain: "game-af286.firebaseapp.com",
  projectId: "game-af286",
  storageBucket: "game-af286.firebasestorage.app",
  messagingSenderId: "567693078252",
  appId: "1:567693078252:web:3b5d6475a583f1f7347fc9",
  measurementId: "G-JKFYDGCFML"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function register(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value;
 if(!email||!pass){ msg.innerText='اكتب الايميل والباسورد'; return; }
 msg.innerText='جاري التسجيل...';
 auth.createUserWithEmailAndPassword(email,pass)
 .then(u=>{
   return db.collection('players').doc(u.user.uid).set({
     email: email,
     createdAt: firebase.firestore.FieldValue.serverTimestamp()
   });
 })
 .then(()=>{
   msg.innerText='✅ تم التسجيل! أهلا '+document.getElementById('email').value;
   setTimeout(()=>{ try{parent.WA.ui.modal.closeModal(); parent.WA.chat.sendChatMessage('دخل اللعبة 🔥','')}catch(e){} },1200);
 })
 .catch(e=> msg.innerText='❌ '+e.message);
}

function login(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value;
 if(!email||!pass){ msg.innerText='اكتب الايميل والباسورد'; return; }
 msg.innerText='جاري الدخول...';
 auth.signInWithEmailAndPassword(email,pass)
 .then(()=>{
   msg.innerText='✅ تم الدخول أهلا '+email;
   setTimeout(()=>{ try{parent.WA.ui.modal.closeModal();}catch(e){} },1000);
 })
 .catch(e=> msg.innerText='❌ '+e.message);
}
const msg=document.getElementById('msg');
</script>
</body>
</html>
