<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101326">
<title>Yalla City</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--text:#f8fafc;--muted:#aab4ca;--purple:#7c3aed;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 0,#35205f 0,transparent 48%),var(--bg);display:flex;flex-direction:column}
header{width:min(900px,92%);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;font-size:1.35rem}
.icon-button{width:46px;height:46px;display:grid;place-items:center;border:1px solid #ffffff25;border-radius:15px;background:#ffffff0b;color:white;font-size:1.3rem;cursor:pointer}
main{width:min(900px,92%);margin:auto;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 0 70px}
.mark{font-size:4.5rem;filter:drop-shadow(0 12px 24px #7c3aed55)}
h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1.1;margin:18px 0;background:linear-gradient(90deg,#c4b5fd,#67e8f9);color:transparent;background-clip:text}
p{color:var(--muted);font-size:1.05rem;line-height:1.8;margin:0 0 28px}
.enter{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:16px;background:linear-gradient(100deg,var(--purple),#5b21b6);color:white;text-decoration:none;font-weight:900;font-size:1.1rem;box-shadow:0 14px 38px #7c3aed44}
.enter:active,.icon-button:active{transform:scale(.98)}
footer{text-align:center;color:#8793aa;font-size:.82rem;padding:20px}
dialog{width:min(420px,calc(100% - 32px));border:1px solid #ffffff25;border-radius:20px;background:#151b31;color:var(--text);padding:24px;box-shadow:0 24px 80px #0009}
dialog::backdrop{background:#030712bb}
dialog h2{margin-top:0}
dialog p{margin-bottom:20px}
.close{border:0;border-radius:12px;background:#ffffff12;color:white;padding:11px 18px;font:inherit;cursor:pointer}
@media(max-width:500px){main{padding-top:20px}.mark{font-size:3.5rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true">🌐</span><span>Yalla City</span></div>
  <button class="icon-button" id="rulesButton" type="button" aria-label="قوانين اللعبة" title="قوانين اللعبة">📜</button>
</header>
<main>
  <div class="mark" aria-hidden="true">🎮</div>
  <h1>Yalla City</h1>
  <p>عالمك الافتراضي مستنيك.</p>
  <a class="enter" href="https://play.workadventu.re/_/global/alaaahmedsayd10-blip.github.io/my-world/conference.tmj?v=5" rel="noopener">🚀 ادخل اللعبة</a>
  <a class="enter" style="margin-top:14px;background:linear-gradient(100deg,#0891b2,#0e7490)" href="https://play.workadventu.re/_/global/alaaahmedsayd10-blip.github.io/my-world/grand-beach.tmj?v=1" rel="noopener">🏖️ جرّب خريطة الشاطئ الجديدة</a>
</main>
<footer>Yalla City</footer>
<dialog id="rulesDialog">
  <h2>📜 قوانين اللعبة</h2>
  <p>احترم اللاعبين الآخرين، وتجنب الإساءة أو الإزعاج، وحافظ على تجربة ممتعة للجميع.</p>
  <button class="close" id="closeRules" type="button">إغلاق</button>
</dialog>
<script>
const rulesDialog=document.getElementById('rulesDialog');
document.getElementById('rulesButton').addEventListener('click',()=>rulesDialog.showModal());
document.getElementById('closeRules').addEventListener('click',()=>rulesDialog.close());
</script>
</body>
</html>
